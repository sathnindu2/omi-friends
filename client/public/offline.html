<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OMI FRIENDS – Offline</title>
    <meta name="theme-color" content="#0b3d2a" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Sinhala', sans-serif;
        color: #f6f1e3;
        background: radial-gradient(ellipse at 50% 40%, #146c43, #0b3d2a 55%, #04170f);
        padding: 24px;
      }
      h1 {
        font-family: Georgia, serif;
        letter-spacing: 0.08em;
        color: #f3d27a;
        margin: 0.3em 0;
      }
      .suits {
        font-size: 2.4rem;
      }
      .red {
        color: #e0454b;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.8rem 1.6rem;
        border: 0;
        border-radius: 999px;
        font-weight: 700;
        font-size: 1rem;
        background: linear-gradient(180deg, #f8df8f, #e2bb4f 45%, #b98d1f);
        color: #2a1d00;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="suits">♠ <span class="red">♥ ♦</span> ♣</div>
      <h1>OMI FRIENDS</h1>
      <p>You are offline. Omi needs an internet connection to play with your friends.</p>
      <p>ඔබ ඔෆ්ලයින්. යාළුවන් සමඟ ඕමි ක්‍රීඩා කිරීමට අන්තර්ජාලය අවශ්‍යයි.</p>
      <button onclick="location.reload()">Try again · නැවත උත්සාහ කරන්න</button>
    </div>
  </body>
</html>
